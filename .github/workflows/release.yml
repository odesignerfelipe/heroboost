name: Hero Boost Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hero-boost-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - run: npm run check
      - run: npm test
      - run: npm run test:native
      - run: npm run smoke
      - name: Prepare one release draft
        run: node .github/scripts/prepare-release.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish draft
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\release\win-unpacked\Hero Boost.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Packaged application smoke failed.' }
          $report = Get-Content -LiteralPath '.\release\win-unpacked\.qa\smoke.json' -Raw | ConvertFrom-Json
          if (-not $report.ok -or -not $report.packaged -or -not $report.maintenance.cacheDeleted -or $report.changes -ne 0) { throw 'Packaged report verification failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Hero-Boost-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
