name: Hero Boost Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - run: npm run check
      - run: npm test
      - run: npm run test:native
      - run: npm run smoke
      - name: Build and publish draft
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Hero-Boost-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
